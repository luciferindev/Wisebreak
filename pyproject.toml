[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "wisebreak"
version = "0.1.0"
description = "WISEBREAK — a read-only Android security research TUI for owner-authorized investigation of managed Samsung devices."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "WISEBREAK contributors" }]
keywords = ["android", "samsung", "knox", "security-research", "firmware", "cve", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Core dependencies are kept minimal; hardware/integration deps are optional
# extras so the app degrades gracefully when they are absent.
dependencies = [
    "textual>=0.70",
    "rich>=13.7",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
usb = ["pyudev>=0.24", "pyusb>=1.2"]
serial = ["pyserial>=3.5"]
firmware = ["lz4>=4.3"]
full = ["pyudev>=0.24", "pyusb>=1.2", "pyserial>=3.5", "lz4>=4.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "textual-dev>=1.5",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://example.invalid/wisebreak"
Issues = "https://example.invalid/wisebreak/issues"

[project.scripts]
wisebreak = "wisebreak.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wisebreak"]

[tool.hatch.build.targets.wheel.force-include]
"src/wisebreak/db/schema.sql" = "wisebreak/db/schema.sql"
"src/wisebreak/data" = "wisebreak/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

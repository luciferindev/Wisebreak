# WISEBREAK configuration file
# ------------------------------
# nano-friendly TOML. Copy to ~/.config/wisebreak/wisebreak.toml and edit.
# Every value below is the built-in default; uncomment to override.

[general]
# Directory for the SQLite research workspace, reports, and firmware cache.
# Explicit path recommended. $USER is expanded at load time.
data_dir = "/home/$USER/Downloads/wisebreak"

# Read-only mode is a hard guarantee: no subsystem will ever write to a
# connected device, flash firmware, or issue state-changing serial commands.
# This flag exists for documentation/auditing. It cannot be set to false
# in a way that enables device writes; the code has no such path.
read_only = true

[privacy]
# Redact serial numbers, IMEIs, and other unique identifiers in reports.
redact_identifiers = true

[usb]
# Poll interval (seconds) for the live USB explorer when pyudev monitoring
# is unavailable and polling fallback is used.
poll_interval = 2.0

[vuln]
# NIST NVD 2.0 API base. An API key is optional but raises rate limits.
# Request one at https://nvd.nist.gov/developers/request-an-api-key
nvd_api_base = "https://services.nvd.nist.gov/rest/json/cves/2.0"
nvd_api_key = ""
# Cache downloaded advisories offline (seconds). Default 7 days.
cache_ttl = 604800
# Network timeout (seconds) per request.
timeout = 30.0

[diagnostics]
# Passive serial capture settings for /dev/ttyACM* interfaces.
# The inspector only READS. It never writes bytes to the port.
default_baud = 115200
read_timeout = 3.0
max_capture_bytes = 65536

[firmware]
# Maximum uncompressed size (bytes) the analyzer will extract from an
# archive entry before refusing (zip-bomb guard). Default 8 GiB.
max_entry_bytes = 8589934592

[reporting]
# Default report formats generated by the "Export report" action.
formats = ["markdown", "json", "html"]
